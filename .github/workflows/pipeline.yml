name: Morphe OpenCode Pipeline

on:
  push:
    branches:
      - main
    paths:
      - "apps.yaml"
      - "apps.yml"
      - "src/**"
      - "scripts/**"
      - ".github/workflows/pipeline.yml"
      - "flake.nix"
      - "pyproject.toml"
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Force rebuild all apps and variants"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: "morphe-pipeline"
  cancel-in-progress: false

jobs:
  build-and-test:
    name: OpenCode Patch, Emulator Test & F-Droid Build
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Enable KVM for Android Emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Android Emulator & Build Tools
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
          BUILD_TOOLS_DIR=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)
          echo "$BUILD_TOOLS_DIR" >> "$GITHUB_PATH"

          CMDLINE_BIN="$ANDROID_HOME/cmdline-tools/latest/bin"
          if [ ! -d "$CMDLINE_BIN" ]; then
            CMDLINE_BIN=$(find "$ANDROID_HOME/cmdline-tools" -mindepth 2 -maxdepth 2 -type d -name bin | head -n1)
          fi
          yes | "$CMDLINE_BIN/sdkmanager" --licenses > /dev/null || true
          "$CMDLINE_BIN/sdkmanager" --install "platform-tools" "emulator" "platforms;android-30" "system-images;android-30;google_apis;x86_64"
          echo "no" | "$CMDLINE_BIN/avdmanager" create avd --force --name "morphe_test_avd" --package "system-images;android-30;google_apis;x86_64" --abi "x86_64" --device "pixel_4"

      - name: Start Android Emulator (boot wait + retry)
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          ADB="$ANDROID_HOME/platform-tools/adb"
          EMU="$ANDROID_HOME/emulator/emulator"
          "$ADB" start-server

          start_emulator() {
            nohup "$EMU" \
              -avd morphe_test_avd \
              -no-window \
              -gpu swiftshader_indirect \
              -no-snapshot \
              -noaudio \
              -no-boot-anim \
              -no-metrics \
              -memory 4096 \
              -accel on > /tmp/emulator.log 2>&1 &
            EMU_PID=$!
          }

          wait_boot() {
            for _ in $(seq 1 72); do
              STATE=$("$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)
              if [ "$STATE" = "1" ]; then return 0; fi
              if ! kill -0 "$EMU_PID" 2>/dev/null; then return 1; fi
              sleep 5
            done
            return 1
          }

          start_emulator
          if ! wait_boot; then
            echo "::warning::First emulator boot attempt failed. Emulator log:"
            tail -n 100 /tmp/emulator.log || true
            kill "$EMU_PID" 2>/dev/null || true
            pkill -f "qemu-system-x86_64" 2>/dev/null || true
            sleep 5
            "$ADB" kill-server || true
            "$ADB" start-server || true
            start_emulator
            if ! wait_boot; then
              echo "::error::Second emulator boot attempt failed. Emulator log:"
              tail -n 200 /tmp/emulator.log || true
              exit 1
            fi
          fi

          "$ADB" shell settings put global window_animation_scale 0 || true
          "$ADB" shell settings put global transition_animation_scale 0 || true
          "$ADB" shell settings put global animator_duration_scale 0 || true
          "$ADB" shell input keyevent 82 || true
          echo "Android Emulator booted and ready: $( "$ADB" devices | tail -n +2 )"

      - name: Install Pipeline Dependencies & Tools (apkeep, fdroidserver, relevance)
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install fdroidserver justapk -e .
          mkdir -p "$HOME/.local/bin" .tools
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          curl -fsSL "https://github.com/EFForg/apkeep/releases/latest/download/apkeep-x86_64-unknown-linux-gnu" -o "$HOME/.local/bin/apkeep"
          chmod +x "$HOME/.local/bin/apkeep"

      - name: Restore Cached F-Droid Repository State
        uses: actions/cache/restore@v4
        with:
          path: fdroid/repo/
          key: fdroid-repo-${{ hashFiles('apps.yaml') }}-${{ github.run_id }}
          restore-keys: |
            fdroid-repo-${{ hashFiles('apps.yaml') }}-
            fdroid-repo-

      - name: Install and Configure OpenCode CLI (DeepSeek V4.1 Flash)
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          curl -fsSL https://opencode.ai/install | bash
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
          mkdir -p "$HOME/.local/share/opencode"
          python3 -c '
          import json, os
          from pathlib import Path
          p = Path.home() / ".local/share/opencode/auth.json"
          p.write_text(json.dumps({"opencode-go": {"type": "api", "key": os.environ["OPENCODE_API_KEY"]}}, indent=2))
          p.chmod(0o600)
          '

      - name: Run OpenCode Agent (DeepSeek V4.1 Flash)
        id: agent
        continue-on-error: true
        timeout-minutes: 32
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_REBUILD: ${{ inputs.force || 'false' }}
        run: |
          export PATH="$HOME/.opencode/bin:$HOME/.local/bin:$PATH"
          FORCE_FLAG=""
          if [ "$FORCE_REBUILD" = "true" ]; then
            FORCE_FLAG="--force"
          fi

          PROMPT="You are the non-interactive Relevance pipeline agent on GitHub Actions. Budget: 15 minutes. Execute ONLY the following steps and nothing else — do not read files, do not explore, do not fix code, do not run any extra commands.

          STEP 1 (always): run \`python3 -m src.main check-updates --config apps.yaml $FORCE_FLAG\`

          STEP 2 (exactly one of these):
          - If every app reports \"needs_update\": false AND fdroid/repo/index-v1.jar exists, run: \`python3 -m src.main test-emulator --repo-dir fdroid/repo\`
          - Otherwise run: \`python3 -m src.main run --config apps.yaml $FORCE_FLAG --test-emulator\`

          STEP 3: If the STEP 2 command succeeded, reply with a 4-line summary (patched versions, emulator coexistence result, F-Droid repo status, any failures) and END YOUR RESPONSE IMMEDIATELY. If it failed, reply with the error and END."

          set +e
          timeout --preserve-status 1500s opencode run --variant minimal --model opencode-go/deepseek-v4.1-flash "$PROMPT"
          AGENT_EXIT=$?
          set -e
          echo "agent_exit_code=$AGENT_EXIT" >> "$GITHUB_OUTPUT"
          if [ "$AGENT_EXIT" -eq 124 ] || [ "$AGENT_EXIT" -eq 143 ]; then
            echo "::warning::OpenCode agent hit its time budget; continuing with deterministic verification."
          elif [ "$AGENT_EXIT" -ne 0 ]; then
            echo "::warning::OpenCode agent exited with code $AGENT_EXIT; continuing with deterministic verification."
          fi
          exit 0

      - name: Verify Built F-Droid Repo & Emulator Coexistence
        if: always()
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_REBUILD: ${{ inputs.force || 'false' }}
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          echo "OpenCode agent exit code: ${{ steps.agent.outputs.agent_exit_code }}"

          if [ ! -f fdroid/repo/index-v1.json ]; then
            echo "F-Droid index missing after agent step; running deterministic pipeline..."
            FORCE_FLAG=""
            if [ "$FORCE_REBUILD" = "true" ]; then
              FORCE_FLAG="--force"
            fi
            python3 -m src.main run --config apps.yaml $FORCE_FLAG --test-emulator
          fi

          python3 -c '
          import json
          from pathlib import Path
          idx = json.loads(Path("fdroid/repo/index-v1.json").read_text())
          pkgs = {a["packageName"]: a.get("localized", {}).get("en-US", {}).get("name") or a.get("name") for a in idx.get("apps", [])}
          print("Indexed F-Droid packages:", pkgs)
          expected = {
              "app.morphe.android.youtube",
              "app.morphe.android.youtube.am",
              "app.morphe.android.youtube.ru",
              "app.morphe.android.youtube.de",
          }
          missing = expected - set(pkgs.keys())
          assert not missing, f"Missing expected packages in F-Droid index: {missing}"
          '

          INSTALLED_PKGS=$(adb shell pm list packages 2>/dev/null || true)
          VARIANT_PKGS="app.morphe.android.youtube app.morphe.android.youtube.am app.morphe.android.youtube.ru app.morphe.android.youtube.de"
          NEEDS_EMULATOR_TEST=0
          for pkg in $VARIANT_PKGS; do
            if ! echo "$INSTALLED_PKGS" | grep -q "package:${pkg}$"; then
              NEEDS_EMULATOR_TEST=1
            fi
          done
          if [ "$NEEDS_EMULATOR_TEST" = "1" ]; then
            echo "Verifying APKs on Android Emulator..."
            python3 -m src.main test-emulator --repo-dir fdroid/repo
          fi
          echo "All 4 YouTube variants verified in F-Droid index and on Android Emulator!"

      - name: Save F-Droid Repository Cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: fdroid/repo/
          key: fdroid-repo-${{ hashFiles('apps.yaml') }}-${{ github.run_id }}

      - name: Upload GitHub Pages Artifact
        if: success()
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./fdroid/repo

      - name: Close Stale Failure Issue On Success
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE_TITLE="[Pipeline Failure] Automated Morphe F-Droid Pipeline Failed"
          EXISTING_ISSUE=$(gh issue list --repo "${{ github.repository }}" --state open --search "\"$ISSUE_TITLE\" in:title" --json number --jq '.[0].number // empty')
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ -n "$EXISTING_ISSUE" ]; then
            gh issue comment "$EXISTING_ISSUE" --repo "${{ github.repository }}" --body "Pipeline recovered in run [#${{ github.run_id }}]($RUN_URL). Closing this issue."
            gh issue close "$EXISTING_ISSUE" --repo "${{ github.repository }}"
          fi

      - name: Open GitHub Issue on Failure (Deduplicated)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE_TITLE="[Pipeline Failure] Automated Morphe F-Droid Pipeline Failed"
          EXISTING_ISSUE=$(gh issue list --repo "${{ github.repository }}" --state open --search "\"$ISSUE_TITLE\" in:title" --json number --jq '.[0].number // empty')
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ -n "$EXISTING_ISSUE" ]; then
            echo "Open issue #$EXISTING_ISSUE already exists. Adding comment with latest run link."
            gh issue comment "$EXISTING_ISSUE" --repo "${{ github.repository }}" --body "Pipeline failed again in run [#${{ github.run_id }}]($RUN_URL) on $(date -u '+%Y-%m-%d %H:%M:%S UTC')."
          else
            gh issue create \
              --repo "${{ github.repository }}" \
              --title "$ISSUE_TITLE" \
              --body "The scheduled/dispatched OpenCode + Morphe F-Droid pipeline failed.

          - **Workflow Run:** [View Run Logs]($RUN_URL)
          - **Commit:** \`${{ github.sha }}\`
          - **Triggered by:** \`${{ github.event_name }}\`

          This issue was automatically opened by the workflow failure handler."
          fi

  deploy-pages:
    name: Deploy F-Droid Repo to GitHub Pages
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        timeout-minutes: 15
      - name: Open GitHub Issue if Pages Deploy Fails
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE_TITLE="[Pipeline Failure] Automated Morphe F-Droid Pipeline Failed"
          EXISTING_ISSUE=$(gh issue list --repo "${{ github.repository }}" --state open --search "\"$ISSUE_TITLE\" in:title" --json number --jq '.[0].number // empty')
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ -z "$EXISTING_ISSUE" ]; then
            gh issue create \
              --repo "${{ github.repository }}" \
              --title "$ISSUE_TITLE" \
              --body "GitHub Pages deployment failed in [Run #${{ github.run_id }}]($RUN_URL)."
          fi

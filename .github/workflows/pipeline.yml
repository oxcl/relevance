name: Morphe OpenCode Pipeline

on:
  push:
    branches:
      - main
    paths:
      - "apps.yaml"
      - "apps.yml"
      - "src/**"
      - "scripts/**"
      - ".github/workflows/pipeline.yml"
      - "flake.nix"
      - "pyproject.toml"
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Force rebuild all apps and variants"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: "morphe-pipeline"
  cancel-in-progress: false

jobs:
  build-and-test:
    name: OpenCode Patch, Emulator Test & F-Droid Build
    runs-on: ubuntu-latest
    timeout-minutes: 70

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Enable KVM for Android Emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Configure Android SDK PATH
        run: |
          ANDROID_SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK/platform-tools" >> "$GITHUB_PATH"
          BUILD_TOOLS_DIR=$(find "$ANDROID_SDK/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)
          echo "$BUILD_TOOLS_DIR" >> "$GITHUB_PATH"

      - name: Install Pipeline Dependencies & Tools (apkeep, fdroidserver, relevance)
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install fdroidserver justapk -e .
          mkdir -p "$HOME/.local/bin" .tools
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          curl -fsSL "https://github.com/EFForg/apkeep/releases/latest/download/apkeep-x86_64-unknown-linux-gnu" -o "$HOME/.local/bin/apkeep"
          chmod +x "$HOME/.local/bin/apkeep"

      - name: Restore Cached F-Droid Repository State
        uses: actions/cache/restore@v4
        with:
          path: fdroid/repo/
          key: fdroid-repo-${{ hashFiles('apps.yaml') }}-${{ github.run_id }}
          restore-keys: |
            fdroid-repo-${{ hashFiles('apps.yaml') }}-
            fdroid-repo-

      - name: Install and Configure OpenCode CLI (DeepSeek V4.1 Flash)
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          curl -fsSL https://opencode.ai/install | bash
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
          mkdir -p "$HOME/.local/share/opencode"
          python3 -c '
          import json, os
          from pathlib import Path
          p = Path.home() / ".local/share/opencode/auth.json"
          p.write_text(json.dumps({"opencode-go": {"type": "api", "key": os.environ["OPENCODE_API_KEY"]}}, indent=2))
          p.chmod(0o600)
          '

      - name: Run OpenCode Agent (DeepSeek V4.1 Flash) + Emulator Verification
        timeout-minutes: 50
        uses: reactivecircus/android-emulator-runner@v2
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_REBUILD: ${{ inputs.force || 'false' }}
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_4
          avd-name: morphe_test_avd
          emulator-boot-timeout: 900
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics -memory 4096
          script: bash scripts/emulator_pipeline.sh

      - name: Save F-Droid Repository Cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: fdroid/repo/
          key: fdroid-repo-${{ hashFiles('apps.yaml') }}-${{ github.run_id }}

      - name: Upload GitHub Pages Artifact
        if: success()
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./fdroid/repo

      - name: Close Stale Failure Issue On Success
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE_TITLE="[Pipeline Failure] Automated Morphe F-Droid Pipeline Failed"
          EXISTING_ISSUE=$(gh issue list --repo "${{ github.repository }}" --state open --search "\"$ISSUE_TITLE\" in:title" --json number --jq '.[0].number // empty')
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ -n "$EXISTING_ISSUE" ]; then
            gh issue comment "$EXISTING_ISSUE" --repo "${{ github.repository }}" --body "Pipeline recovered in run [#${{ github.run_id }}]($RUN_URL). Closing this issue."
            gh issue close "$EXISTING_ISSUE" --repo "${{ github.repository }}"
          fi

      - name: Open GitHub Issue on Failure (Deduplicated)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE_TITLE="[Pipeline Failure] Automated Morphe F-Droid Pipeline Failed"
          EXISTING_ISSUE=$(gh issue list --repo "${{ github.repository }}" --state open --search "\"$ISSUE_TITLE\" in:title" --json number --jq '.[0].number // empty')
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ -n "$EXISTING_ISSUE" ]; then
            echo "Open issue #$EXISTING_ISSUE already exists. Adding comment with latest run link."
            gh issue comment "$EXISTING_ISSUE" --repo "${{ github.repository }}" --body "Pipeline failed again in run [#${{ github.run_id }}]($RUN_URL) on $(date -u '+%Y-%m-%d %H:%M:%S UTC')."
          else
            gh issue create \
              --repo "${{ github.repository }}" \
              --title "$ISSUE_TITLE" \
              --body "The scheduled/dispatched OpenCode + Morphe F-Droid pipeline failed.

          - **Workflow Run:** [View Run Logs]($RUN_URL)
          - **Commit:** \`${{ github.sha }}\`
          - **Triggered by:** \`${{ github.event_name }}\`

          This issue was automatically opened by the workflow failure handler."
          fi

  deploy-pages:
    name: Deploy F-Droid Repo to GitHub Pages
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        timeout-minutes: 15
      - name: Open GitHub Issue if Pages Deploy Fails
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE_TITLE="[Pipeline Failure] Automated Morphe F-Droid Pipeline Failed"
          EXISTING_ISSUE=$(gh issue list --repo "${{ github.repository }}" --state open --search "\"$ISSUE_TITLE\" in:title" --json number --jq '.[0].number // empty')
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ -z "$EXISTING_ISSUE" ]; then
            gh issue create \
              --repo "${{ github.repository }}" \
              --title "$ISSUE_TITLE" \
              --body "GitHub Pages deployment failed in [Run #${{ github.run_id }}]($RUN_URL)."
          fi

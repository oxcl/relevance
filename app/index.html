<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Relevance</title>
    <meta name="description" content="Modify Android apps, build them in your own GitHub Actions and publish your own F-Droid repository and app store." />
    <meta name="theme-color" content="#f6eee3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1d1814" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/logo.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      try {
        const t = localStorage.getItem('rv-theme');
        if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
      } catch {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
